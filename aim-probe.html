<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>aim probe</title></head>
<body>
<script type="module">
import * as THREE from 'three';
import { clone as cloneWithSkeleton } from 'three/addons/utils/SkeletonUtils.js';
import { loadModelData } from '/src/objects/gltf.js';
import { createCharacterAnimator } from '/src/anim/character-animator.js';
import { detectProfile } from '/src/anim/skeleton-profile.js';
import { WEAPONS } from '/src/combat/weapons.js';

/**
 * Числовая трасса прицеливания: какие клипы играют, с какими весами, и куда смотрит ствол.
 *
 * Аниматор собирается тут напрямую, а не через buildGltfCharacter: стенду нужен доступ к
 * мешалке, чтобы назвать играющие клипы, а игре он не нужен.
 */
const params = new URLSearchParams(location.search);
const number = (key, fallback) => Number(params.get(key) ?? fallback);
const src = params.get('model') ?? 'assets/models/gta-ballas.glb';
const frames = number('frames', 90);
const aiming = params.get('aiming') !== '0';
const gun = WEAPONS[number('gun', 0)];

const { scene, animations } = await loadModelData(src);
const model = cloneWithSkeleton(scene);
const root = new THREE.Group();
root.add(model);
root.rotation.y = number('yaw', 0);
const profile = detectProfile(model);
const animator = createCharacterAnimator({ model, animations, profile });

const pose = {
  speed: number('speed', 0),
  aiming,
  moveDir: { x: number('x', 0), z: number('z', 1) },
  airborne: false,
  jumpTime: 0,
  landing: false,
  aimYaw: number('aimYaw', 0),
  aimPitch: number('pitch', 0),
  shotId: 0,
  reloadId: 0,
  weapon: params.get('weapon') === '0' ? null : gun,
};

const deg = (radians) => (radians * 180 / Math.PI).toFixed(1);
const bone = (role) => model.getObjectByName(profile.bones[role]);
const watched = ['spine', 'chest', 'armR'].map((role) => [role, bone(role)]).filter(([, it]) => it);
const rest = new Map(watched.map(([role, it]) => [role, it.quaternion.clone()]));
const hand = bone('handR');
const finger = hand?.children.find((node) => node.isBone);
const characterFrame = new THREE.Quaternion();
const barrel = new THREE.Vector3();
const wanted = new THREE.Vector3();

/** Ствол авторен вдоль кости кисти, поэтому его направление задаёт вектор до её ребёнка. */
function barrelInCharacterSpace() {
  root.updateWorldMatrix(true, true);
  root.getWorldQuaternion(characterFrame).invert();
  barrel.subVectors(finger.getWorldPosition(new THREE.Vector3()),
                    hand.getWorldPosition(new THREE.Vector3()));
  return barrel.applyQuaternion(characterFrame).normalize();
}

function playing() {
  return animator.mixer._actions
    .filter((action) => action.getEffectiveWeight() > 0.01)
    .map((action) => `${action.getClip().name}=${action.getEffectiveWeight().toFixed(2)}`
      + `@${action.timeScale.toFixed(2)} t=${action.time.toFixed(2)}`
      + ` (${action.getClip().tracks.length} треков)`)
    .join(' ');
}

function report(frame) {
  const drift = watched
    .map(([role, it]) => `${role} ${deg(it.quaternion.angleTo(rest.get(role)))}`).join(' | ');
  const aim = finger ? barrelInCharacterSpace() : null;
  const gunAim = aim
    ? `ствол yaw=${deg(Math.atan2(aim.x, aim.z))} pitch=${deg(-Math.asin(aim.y))}` : '';
  console.log(`frame ${String(frame).padStart(3)} | ${playing()} | ${drift} | ${gunAim}`);
}

wanted.set(0, 0, 1)
  .applyAxisAngle(new THREE.Vector3(1, 0, 0), pose.aimPitch)
  .applyAxisAngle(new THREE.Vector3(0, 1, 0), pose.aimYaw);
console.log(`probe ${src} profile=${profile.id} ствол=${pose.weapon?.id ?? 'нет'}`
  + ` скорость=${pose.speed} moveDir=(${pose.moveDir.x},${pose.moveDir.z})`
  + ` цель yaw=${deg(Math.atan2(wanted.x, wanted.z))} pitch=${deg(-Math.asin(wanted.y))}`);
console.log(`coverage ${JSON.stringify(animator.debug().roles)}`);
for (let frame = 1; frame <= frames; frame += 1) {
  animator.update(1 / 60, pose);
  if (frame % 15 === 0 || frame < 3) report(frame);
}

if (params.has('reload')) {
  pose.reloadId += 1;
  const seconds = animator.update(0, pose);
  console.log(`reload вернул ${seconds}`);
  for (let frame = 1; frame <= frames; frame += 1) {
    animator.update(1 / 60, pose);
    if (frame % 10 === 0) report(frame);
  }
}

console.log('probe done');
</script>
</body>
</html>
