<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>aim render</title>
<style>html,body{margin:0;background:#20222b;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { clone as cloneWithSkeleton } from 'three/addons/utils/SkeletonUtils.js';
import { loadModelData } from '/src/objects/gltf.js';
import { createCharacterAnimator } from '/src/anim/character-animator.js';
import { detectProfile } from '/src/anim/skeleton-profile.js';
import { WEAPONS } from '/src/combat/weapons.js';

/**
 * Рендер прицельной позы: шар это цель, зелёный луч это ствол, они должны совпасть.
 *
 * Направление ствола берётся так же, как его берёт крепление оружия: вдоль кости кисти,
 * от неё к дочерней кости (F-049).
 */
const params = new URLSearchParams(location.search);
const number = (key, fallback) => Number(params.get(key) ?? fallback);
const src = params.get('model') ?? 'assets/models/gta-ballas.glb';
const frames = number('frames', 90);
const view = params.get('view') ?? 'side';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(520, 640);
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#20222b');
scene.add(new THREE.HemisphereLight('#dfe6ff', '#2b2a35', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2);
sun.position.set(3, 6, 4);
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8),
  new THREE.MeshStandardMaterial({ color: '#3b3d4a' }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
for (let i = -2; i <= 2; i += 1) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.75, 0.04),
    new THREE.MeshStandardMaterial({ color: i ? '#4d5060' : '#7a6cff' }));
  post.position.set(i * 0.9, 0.875, -1.6);
  scene.add(post);
}

const { scene: source, animations } = await loadModelData(src);
const model = cloneWithSkeleton(source);
const root = new THREE.Group();
root.add(model);
root.rotation.y = number('yaw', 0);
scene.add(root);
const profile = detectProfile(model);
const animator = createCharacterAnimator({ model, animations, profile });

const pose = {
  speed: number('speed', 0),
  aiming: params.get('aiming') !== '0',
  moveDir: { x: number('x', 0), z: number('z', 1) },
  airborne: false,
  jumpTime: 0,
  landing: false,
  aimYaw: number('aimYaw', 0),
  aimPitch: number('pitch', 0),
  shotId: 0,
  reloadId: 0,
  weapon: params.get('weapon') === '0' ? null : WEAPONS[number('gun', 0)],
};

const hand = model.getObjectByName(profile.bones.handR);
const finger = hand?.children.find((node) => node.isBone);
const wanted = new THREE.Vector3(0, 0, 1)
  .applyAxisAngle(new THREE.Vector3(1, 0, 0), pose.aimPitch)
  .applyAxisAngle(new THREE.Vector3(0, 1, 0), pose.aimYaw)
  .applyAxisAngle(new THREE.Vector3(0, 1, 0), root.rotation.y);
const target = new THREE.Mesh(new THREE.SphereGeometry(0.08),
  new THREE.MeshBasicMaterial({ color: '#ff4d6d' }));
target.position.copy(wanted).multiplyScalar(3).setY(1.4 + wanted.y * 3);
scene.add(target);
const ray = new THREE.Line(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color: '#7bff8f' }));
scene.add(ray);

const camera = new THREE.PerspectiveCamera(38, 520 / 640, 0.1, 50);
camera.position.copy(view === 'front' ? new THREE.Vector3(0, 1.1, 3.4)
  : view === 'top' ? new THREE.Vector3(0.2, 5, 0.2) : new THREE.Vector3(3.2, 1.2, 0.9));
// Взгляд сверху вдоль вертикали вырождает камерный «верх», поэтому его надо задать самому:
// иначе вид крутит вокруг оси и по нему не понять, в какую сторону шагает персонаж.
if (view === 'top') camera.up.set(0, 0, -1);
camera.lookAt(0, view === 'top' ? 0 : 0.95, 0);

for (let frame = 0; frame < frames; frame += 1) animator.update(1 / 60, pose);
if (params.has('reload')) {
  pose.reloadId += 1;
  console.log(`reload вернул ${animator.update(0, pose)}`);
  for (let frame = 0; frame < number('after', 15); frame += 1) animator.update(1 / 60, pose);
}

if (finger) {
  root.updateWorldMatrix(true, true);
  const from = hand.getWorldPosition(new THREE.Vector3());
  const along = finger.getWorldPosition(new THREE.Vector3()).sub(from).normalize();
  ray.geometry.setFromPoints([from, from.clone().addScaledVector(along, 3)]);
}
renderer.render(scene, camera);
// Картинка уезжает в консоль кусками: снимок headless-браузера ловит пустой холст, а
// консоль отдаётся дампом, поэтому это единственный способ увидеть позу глазами.
const png = renderer.domElement.toDataURL('image/png').split(',')[1];
const CHUNK = 3000;
for (let at = 0; at < png.length; at += CHUNK) console.log(`png ${png.slice(at, at + CHUNK)}`);
console.log(`render done ${src} frames=${frames} clips=${JSON.stringify(
  animator.mixer._actions.filter((action) => action.getEffectiveWeight() > 0.01)
    .map((action) => `${action.getClip().name}=${action.getEffectiveWeight().toFixed(2)}`))}`);
</script>
</body>
</html>
