<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>aim render</title>
<style>html,body{margin:0;background:#20222b;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { buildGltfCharacter } from '/src/npc/gltf-character.js';
import { WEAPONS } from '/src/combat/weapons.js';

const params = new URLSearchParams(location.search);
const src = params.get('model') ?? 'assets/models/gta-ballas.glb';
const frames = Number(params.get('frames') ?? 90);
const pitch = Number(params.get('pitch') ?? 0.4);
const yaw = Number(params.get('yaw') ?? 0);
const aiming = params.get('aiming') !== '0';
const view = params.get('view') ?? 'side';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(520, 640);
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#20222b');
scene.add(new THREE.HemisphereLight('#dfe6ff', '#2b2a35', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2);
sun.position.set(3, 6, 4);
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8),
  new THREE.MeshStandardMaterial({ color: '#3b3d4a' }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
for (let i = -2; i <= 2; i += 1) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.75, 0.04),
    new THREE.MeshStandardMaterial({ color: i ? '#4d5060' : '#7a6cff' }));
  post.position.set(i * 0.9, 0.875, -1.6);
  scene.add(post);
}

const character = await buildGltfCharacter(src);
character.object.rotation.y = yaw;
scene.add(character.object);

const camera = new THREE.PerspectiveCamera(38, 520 / 640, 0.1, 50);
const eye = view === 'front' ? new THREE.Vector3(0, 1.1, 3.4) : new THREE.Vector3(3.2, 1.2, 0.9);
camera.position.copy(eye);
camera.lookAt(0, 0.95, 0);

const pose = {
  speed: 0,
  aiming,
  moveDir: { x: 0, z: 0 },
  airborne: false,
  jumpTime: 0,
  landing: false,
  aimYaw: 0,
  aimPitch: pitch,
  firing: false,
  shotId: 0,
  weapon: WEAPONS[0],
  recoilT: 0,
};

for (let frame = 0; frame < frames; frame += 1) character.update(1 / 60, pose);
renderer.render(scene, camera);
const png = renderer.domElement.toDataURL('image/png').split(',')[1];
const CHUNK = 3000;
for (let at = 0; at < png.length; at += CHUNK) console.log(`png ${png.slice(at, at + CHUNK)}`);
console.log(`render done ${src} frames=${frames} pitch=${pitch} aiming=${aiming}`);
window.close();
</script>
</body>
</html>
